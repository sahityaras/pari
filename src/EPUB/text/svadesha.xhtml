<span/><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>स्वदेश</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>मुटुको रसले फुल्दछ उपवन,<br/>
सपना बादल भेष<br/>
लिइकन न्यौछावर गरी चल्छन्,<br/>
हरियो हुन्छ स्वदेश !<br/>
<br/>
चल्दछ एक सुवास हवामा<br/>
जीवनको अति बेस,<br/>
चिडिया अरू ता आए, गाए,<br/>
कोकिलको सन्देश !
</p>
