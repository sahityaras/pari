<span/><div class="chapter-title" style="text-align:center;"><span style="font-size:144%;"><b>क्षण</b></span></div>
<div style="text-indent:0; position:relative; margin:0 auto; text-align:left; display:table; width:auto;">
<div class="poem">
<p>क्षणमा पाउनु दिव्य अनन्त,<br/>
अल्पैभित्र विशाल,<br/>
दानाभरमा पूर्ण मनोहर,<br/>
कणमा सागर, छाल ।<br/>
<br/>
दुई दिन कसले भन्दछ जीवन ?<br/>
दिव्य शिखाको राप,<br/>
क्षणकन दिन्छ शिँगार विचित्र<br/>
छविले युगका लाख !<br/>
<br/>
क्षण र पलाको सुन्दर जगमगी<br/>
जीवनको श्रृंगार,<br/>
अमिट र अमर जुहारतक<br/>
जागृत क्षण छ अपार !
</p>
